<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Макет - Anonymizer 4.0 (задание 01)</title>
<style>
/* Отличия токенов от LKD app.css (контраст 1.9): --ok темнее (#276b43, было 4,4 : 1 на --ok-soft), версия внизу меню - --muted.
   Макет задания 01 (описание v2 «как должно быть»). Каркас и токены - как в Legal Knowledge Desk web/static/app.css
   (эталон стандарта 1.1, 1.3); значки - lucide 0.469 (ISC). Состояние - адрес (#upload, #done…), тема - ?theme=dark.
   Код программы по макету пишется только после утверждения. Все данные - вымышленные. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --border: #dfe3e8; --border-strong: #c9cfd7;
  --text: #1b2230; --muted: #5f6b7a; --faint: #8a94a3; --accent: #1f3864; --accent-soft: #e6ecf5; --accent-text: #ffffff;
  --ok: #276b43; --ok-soft: #e5f3ea; --warn: #8a5800; --warn-soft: #fbf1dc; --bad: #b3261e; --bad-soft: #fbe7e5;
  --info: #1d5fb8; --info-soft: #e3eefc;
  --paper: #ffffff; --paper-text: #1b2230;
  --k-person-bg: #dbe7ff; --k-person: #1d3f8f; --k-org-bg: #dff1e5; --k-org: #1e6037;
  --k-addr-bg: #fbedcf; --k-addr: #6e4300; --k-num-bg: #ece3fa; --k-num: #55278c;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --shadow-lg: 0 10px 30px rgba(16, 24, 40, .18);
  --overlay: rgba(16, 24, 40, .38);
  --radius: 10px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
:root[data-theme="dark"] {
  --bg: #0f1218; --surface: #171b23; --surface-2: #1d222c; --border: #2a313d; --border-strong: #3a4250;
  --text: #e5e9f0; --muted: #a3adbd; --faint: #7d8796; --accent: #8fb0e8; --accent-soft: #1e2a40; --accent-text: #0f1218;
  --ok: #6cc28f; --ok-soft: #16271d; --warn: #e3b25a; --warn-soft: #2b2416; --bad: #f08b84; --bad-soft: #2e1a19;
  --info: #8fb0e8; --info-soft: #1e2a40;
  --paper: #ffffff; --paper-text: #1b2230;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 10px 30px rgba(0,0,0,.55); --overlay: rgba(0, 0, 0, .55);
}
html { font-size: 16px; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 1.0625rem/1.55 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
h1 { font-size: 1.625rem; line-height: 1.3; margin: 0; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 1.125rem; margin: 0; font-weight: 620; }
svg.i { width: 18px; height: 18px; stroke-width: 1.8; flex: none; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
.muted { color: var(--muted); } .small { font-size: .9375rem; } .xs { font-size: .8125rem; }
.mono { font-family: var(--mono); font-size: .875rem; }

.shell { display: flex; height: 100vh; overflow: hidden; }
.side { width: 220px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 12px; box-sizing: border-box; }
.logo { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 1rem; color: var(--accent); padding: 0 4px 18px 10px; }
.menu, .side-bottom { display: flex; flex-direction: column; gap: 2px; }
.mi { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--text); font-size: .9375rem; white-space: nowrap; }
.mi svg { color: var(--muted); }
.mi.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.mi.on svg { color: var(--accent); }
.side-bottom { margin-top: auto; border-top: 1px solid var(--border); padding-top: 10px; }
.ver { color: var(--muted); font-size: .8125rem; padding: 6px 10px 0; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.top { display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--surface); box-sizing: border-box; flex: none; }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); font-size: .9375rem; white-space: nowrap; }
.crumbs b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-size: .9375rem; }
.grow { flex: 1; }
.model { display: inline-flex; align-items: center; gap: 7px; font-size: .9375rem; white-space: nowrap; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); }
.model .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
.model.work .dot { background: var(--info); } .model.wait .dot { background: var(--warn); }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; }
.seg span { padding: 3px 11px; border-radius: 7px; font-size: .9375rem; color: var(--muted); white-space: nowrap; }
.seg span.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
.content { flex: 1; min-height: 0; overflow: auto; padding: 22px 24px 32px; box-sizing: border-box; position: relative; }

.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 8px; font-size: .9375rem; white-space: nowrap; color: var(--text); cursor: default; }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; padding: 9px 18px; }
.btn.primary[disabled] { background: var(--surface-2); border-color: var(--border-strong); color: var(--muted); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 600; }
:root[data-theme="dark"] .btn.danger { color: #1b0c0b; }
.btn.sm { padding: 4px 9px; }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); }
.ib { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; color: var(--muted); }
.ib:hover { background: var(--surface-2); }
.link { color: var(--accent); }
.field { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: .9375rem; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); box-sizing: border-box; white-space: nowrap; overflow: hidden; }
.field svg { width: 16px; height: 16px; }
.sel { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: .9375rem; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.sel svg { width: 15px; height: 15px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; font-size: .875rem; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip svg { width: 14px; height: 14px; }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.info { background: var(--info-soft); color: var(--info); }

.head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 14px; }
.head .t { flex: 1; min-width: 0; }
.head .sub { color: var(--muted); font-size: .9375rem; margin-top: 2px; }
.head .act { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.sessline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; font-size: .9375rem; }
.sessline .nm { font-weight: 600; }
.drop { border: 2px dashed var(--border-strong); border-radius: var(--radius); background: var(--surface); display: flex; align-items: center; justify-content: center; gap: 14px; color: var(--muted); text-align: center; }
.drop.big { flex-direction: column; height: 250px; gap: 8px; }
.drop.big svg { width: 34px; height: 34px; color: var(--accent); }
.drop.strip { height: 48px; font-size: .9375rem; margin-bottom: 12px; }
.drop.strip svg { width: 18px; height: 18px; color: var(--accent); }
.drop b { color: var(--text); }
.list { display: flex; flex-direction: column; }
.list .row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); min-height: 44px; }
.list .row:last-child { border-bottom: 0; }
.row .ic { width: 34px; height: 34px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.row .main2 { flex: 1; min-width: 0; }
.row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { color: var(--muted); font-size: .9375rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row .meta.ok { color: var(--ok); } .row .meta.warn { color: var(--warn); } .row .meta.bad { color: var(--bad); }
.row .acts { display: flex; align-items: center; gap: 6px; flex: none; }
.prog { padding: 14px 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; height: 84px; box-sizing: border-box; }
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
.bar i { display: block; height: 100%; background: var(--info); border-radius: 999px; }
.prow { display: flex; align-items: center; gap: 12px; font-size: .9375rem; }
.sum { padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.sum .big { font-weight: 650; font-size: 1.0625rem; display: inline-flex; align-items: center; gap: 8px; }
.sum .big svg { color: var(--ok); width: 22px; height: 22px; }
.sec { margin-top: 18px; }
.sec-h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.sec-h h2 { display: inline-flex; align-items: center; gap: 6px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .9375rem; }
.tbl th { text-align: left; font-weight: 600; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.tbl td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tok { display: inline-block; padding: 0 6px; border-radius: 5px; font-weight: 650; font-family: var(--mono); font-size: .84em; white-space: nowrap; }
.k-p { background: var(--k-person-bg); color: var(--k-person); } .k-o { background: var(--k-org-bg); color: var(--k-org); }
.k-a { background: var(--k-addr-bg); color: var(--k-addr); } .k-n { background: var(--k-num-bg); color: var(--k-num); }
.forms { color: var(--muted); }

/* просмотр */
.pv { display: grid; grid-template-columns: 1fr 360px; gap: 0; height: calc(100vh - 48px - 22px - 32px - 58px); min-height: 440px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.pvbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.pvbar .fn { font-weight: 650; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: .9375rem; white-space: nowrap; }
.box { width: 16px; height: 16px; border: 1.5px solid var(--border-strong); border-radius: 4px; background: var(--surface); display: inline-block; box-sizing: border-box; }
.doc { background: var(--surface-2); overflow: hidden; padding: 18px 24px; position: relative; }
.sheet { background: var(--paper); color: var(--paper-text); border-radius: 4px; box-shadow: var(--shadow); padding: 34px 44px; font: 15px/1.6 "Times New Roman", Georgia, serif; max-width: 720px; margin: 0 auto; position: relative; }
.sheet h3 { text-align: center; font: 700 16px/1.4 "Times New Roman", Georgia, serif; margin: 0 0 4px; }
.sheet .c { text-align: center; margin: 0 0 14px; }
.sheet p { margin: 0 0 9px; text-align: justify; }
.sheet .tok { font-size: 13px; }
.sheet .cur { outline: 2px solid var(--accent); outline-offset: 1px; }
:root[data-theme="dark"] .sheet .cur { outline-color: #1f3864; }
.sheet .selx { background: #b9d3ff; }
.floatbtn { position: absolute; background: #1f3864; color: #fff; border-radius: 8px; padding: 5px 11px; font: 600 14px var(--font); box-shadow: var(--shadow-lg); display: inline-flex; gap: 6px; align-items: center; }
.floatbtn svg { width: 15px; height: 15px; }
.side2 { border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.side2 .ph { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.side2 .ps { overflow: hidden; padding: 6px 0; flex: 1; }
.alert { border-radius: 8px; padding: 8px 10px; font-size: .9375rem; display: flex; gap: 8px; align-items: flex-start; }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert svg { width: 17px; height: 17px; margin-top: 2px; }
.grp { padding: 4px 14px 2px; color: var(--muted); font-size: .8125rem; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; }
.val { padding: 7px 14px; display: flex; flex-direction: column; gap: 4px; }
.val .l { display: flex; align-items: baseline; gap: 8px; }
.val .l .v { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.val .l .n { color: var(--muted); font-size: .875rem; }
.val.on { background: var(--accent-soft); border-left: 3px solid var(--accent); padding-left: 11px; }
.val .f { color: var(--muted); font-size: .875rem; }
.val .b { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

/* окна */
.ov { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; z-index: 10; }
.dlg { width: 500px; max-width: calc(100vw - 48px); background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 20px 22px 18px; border: 1px solid var(--border); box-sizing: border-box; }
.dlg h2 { font-size: 1.1875rem; margin-bottom: 8px; }
.dlg p { margin: 0 0 12px; font-size: .9375rem; }
.dlg .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.dlg .hint { color: var(--muted); font-size: .8125rem; margin-top: 8px; }
.radio { display: flex; align-items: center; gap: 8px; font-size: .9375rem; padding: 4px 0; }
.rd { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--border-strong); box-sizing: border-box; display: inline-block; flex: none; background: var(--surface); }
.rd.on { border: 5px solid var(--accent); }
.focusring { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent) inset; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #1b2230; color: #fff; padding: 9px 14px; border-radius: 10px; box-shadow: var(--shadow-lg); display: flex; gap: 14px; align-items: center; font-size: .9375rem; }
.toast b { color: #b9cdf5; }
:root[data-theme="dark"] .toast { background: #e5e9f0; color: #0f1218; }
:root[data-theme="dark"] .toast b { color: #1f3864; }

/* настройки */
.sgrp { margin-bottom: 14px; }
.sgrp > .gh { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.sgrp > .gh svg { color: var(--muted); }
.srow { display: flex; align-items: center; gap: 16px; padding: 11px 16px; border-bottom: 1px solid var(--border); }
.srow:last-child { border-bottom: 0; }
.srow .lab { flex: 1; min-width: 0; }
.srow .lab .d { color: var(--muted); font-size: .875rem; }
.sw { width: 36px; height: 20px; border-radius: 999px; background: var(--border-strong); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
.sw.on { background: var(--accent); } .sw.on::after { left: 18px; }
:root[data-theme="dark"] .sw.on::after { background: #0f1218; }
.collapsed { color: var(--muted); }

/* узкое окно (стандарт 1.6) */
@media (max-width: 1100px) {
  .side { width: 60px; padding: 14px 8px; }
  .logo .lt, .mi span, .ver { display: none; }
  .logo { justify-content: center; padding: 0 0 16px; }
  .mi { justify-content: center; padding: 9px 0; }
  .pv { grid-template-columns: 1fr 300px; }
  .sheet { padding: 26px 26px; }
  .doc { padding: 14px; }
  .content { padding: 18px 18px 28px; }
  .top { padding: 0 16px; gap: 10px; }
  .hide-narrow { display: none !important; }
}
</style>
</head>

<div class="shell">
  <aside class="side">
    <div class="logo"><span class="lt">Anonymizer</span><span class="ib">__I_panel-left__</span></div>
    <nav class="menu" id="menu"></nav>
    <div class="side-bottom">
      <div class="mi">__I_circle-help__<span>Справка</span></div>
      <div class="mi" id="mi-settings">__I_settings__<span>Настройки</span></div>
      <div class="mi">__I_sun-moon__<span>Тема</span></div>
      <div class="ver">Anonymizer 4.0</div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="crumbs" id="crumbs"></div>
      <div class="grow"></div>
      <span class="model" id="model"><i class="dot"></i><span id="model-t">Модель готова</span></span>
      <div class="seg"><span class="on">RU</span><span>EN</span></div>
      <span class="btn sm">Aa</span>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

" rx=\"2\"></rect><path d=\"M9 3v18\"></path>", "search": "<circle cx=\"11\" cy=\"11\" r=\"8\"></circle><path d=\"m21 21-4.3-4.3\"></path>", "plus": "<path d=\"M5 12h14\"></path><path d=\"M12 5v14\"></path>", "upload": "<path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"></path><polyline points=\"17 8 12 3 7 8\"></polyline><line x1=\"12\" x2=\"12\" y1=\"3\" y2=\"15\"></line>", "download": "<path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"></path><polyline points=\"7 10 12 15 17 10\"></polyline><line x1=\"12\" x2=\"12\" y1=\"15\" y2=\"3\"></line>", "ellipsis": "<circle cx=\"12\" cy=\"12\" r=\"1\"></circle><circle cx=\"19\" cy=\"12\" r=\"1\"></circle><circle cx=\"5\" cy=\"12\" r=\"1\"></circle>", "x": "<path d=\"M18 6 6 18\"></path><path d=\"m6 6 12 12\"></path>", "copy": "<rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"></rect><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"></path>", "pencil": "<path d=\"M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z\"></path><path d=\"m15 5 4 4\"></path>", "shield-check": "<path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"></path><path d=\"m9 12 2 2 4-4\"></path>", "file-text": "<path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"></path><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"></path><path d=\"M10 9H8\"></path><path d=\"M16 13H8\"></path><path d=\"M16 17H8\"></path>", "trash-2": "<path d=\"M3 6h18\"></path><path d=\"M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6\"></path><path d=\"M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2\"></path><line x1=\"10\" x2=\"10\" y1=\"11\" y2=\"17\"></line><line x1=\"14\" x2=\"14\" y1=\"11\" y2=\"17\"></line>", "chevron-down": "<path d=\"m6 9 6 6 6-6\"></path>", "arrow-left": "<path d=\"m12 19-7-7 7-7\"></path><path d=\"M19 12H5\"></path>", "triangle-alert": "<path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"></path><path d=\"M12 9v4\"></path><path d=\"M12 17h.01\"></path>", "check": "<path d=\"M20 6 9 17l-5-5\"></path>", "menu": "<line x1=\"4\" x2=\"20\" y1=\"12\" y2=\"12\"></line><line x1=\"4\" x2=\"20\" y1=\"6\" y2=\"6\"></line><line x1=\"4\" x2=\"20\" y1=\"18\" y2=\"18\"></line>", "clock": "<circle cx=\"12\" cy=\"12\" r=\"10\"></circle><polyline points=\"12 6 12 12 16 14\"></polyline>", "square": "<rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\"></rect>", "file-spreadsheet": "<path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"></path><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"></path><path d=\"M8 13h2\"></path><path d=\"M14 13h2\"></path><path d=\"M8 17h2\"></path><path d=\"M14 17h2\"></path>", "image": "<rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\" ry=\"2\"></rect><circle cx=\"9\" cy=\"9\" r=\"2\"></circle><path d=\"m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21\"></path>", "eye": "<path d=\"M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0\"></path><circle cx=\"12\" cy=\"12\" r=\"3\"></circle>", "rotate-ccw": "<path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"></path><path d=\"M3 3v5h5\"></path>", "circle-stop": "<circle cx=\"12\" cy=\"12\" r=\"10\"></circle><rect x=\"9\" y=\"9\" width=\"6\" height=\"6\" rx=\"1\"></rect>", "info": "<circle cx=\"12\" cy=\"12\" r=\"10\"></circle><path d=\"M12 16v-4\"></path><path d=\"M12 8h.01\"></path>", "merge": "<path d=\"m8 6 4-4 4 4\"></path><path d=\"M12 2v10.3a4 4 0 0 1-1.172 2.872L4 22\"></path><path d=\"m20 22-5-5\"></path>"};
const ic = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24">${I[n] || ""}</svg>`;
document.body.innerHTML = document.body.innerHTML.replace(/__I_([a-z0-9-]+)__/g, (m, n) => ic(n));
const q = new URLSearchParams(location.search);
document.documentElement.dataset.theme = q.get("theme") === "dark" ? "dark" : "light";

const MENU = [["anon", "eye-off", "Обезличить"], ["restore", "undo-2", "Вернуть данные"], ["sessions", "folder", "Сессии"], ["dict", "book-open", "Словарь"]];
function menu(active) {
  document.getElementById("menu").innerHTML = MENU.map(([k, i, t]) => `<div class="mi${k === active ? " on" : ""}">${ic(i)}<span>${t}</span></div>`).join("");
  document.getElementById("mi-settings").classList.toggle("on", active === "settings");
}
function crumbs(parts, back) {
  document.getElementById("crumbs").innerHTML = (back ? `<span class="back">${ic("arrow-left")}Назад</span><span>·</span>` : "")
    + parts.map((p, i) => i === parts.length - 1 ? `<b>${p}</b>` : `<span class="${i < parts.length - 2 ? "hide-narrow" : ""}">${p}</span><span class="${i < parts.length - 2 ? "hide-narrow" : ""}">›</span>`).join("");
}
function model(cls, text) { const m = document.getElementById("model"); m.className = "model " + cls; document.getElementById("model-t").textContent = text; }

const tok = (t, k) => `<span class="tok k-${k}">[${t}]</span>`;
const SESS = "Сессия 24.10";
const head = (title, sub, action) => `<div class="head"><div class="t"><h1>${title}</h1><div class="sub">${sub}</div></div>${action ? `<div class="act">${action}</div>` : ""}</div>`;
const sessline = (files, recs) => `<div class="sessline"><span class="muted">Сессия:</span><span class="nm">${SESS}</span><span class="muted">· ${files} · ${recs}</span><span class="ib">${ic("pencil")}</span><span class="grow"></span><span class="btn sm">${ic("plus")}Новая сессия</span></div>`;
const strip = `<div class="drop strip">${ic("upload")}<span><b>Перетащите ещё файлы</b> или выберите на компьютере</span></div>`;
const ANON_SUB = "Файлы одной сессии получают общие метки: один человек - одна метка во всех файлах.";

const fileIc = { doc: "file-text", xls: "file-spreadsheet", img: "image" };
function frow(kind, name, meta, metaCls, acts) {
  return `<div class="row"><span class="ic">${ic(fileIc[kind])}</span><div class="main2"><div class="nm">${name}</div><div class="meta ${metaCls || ""}">${meta}</div></div><div class="acts">${acts}</div></div>`;
}
const ACT_DONE = `<span class="btn sm">${ic("eye")}Просмотр</span><span class="btn sm">${ic("download")}Скачать${ic("chevron-down")}</span><span class="ib">${ic("ellipsis")}</span>`;
const ACT_NEW = `<span class="ib" title="Убрать">${ic("x")}</span>`;

function table(n, total = 41) {
  const rows = [
    [tok("FIO_1", "p"), "Петров Иван Сергеевич <span class='forms'>· Петрову И. С. · Петров</span>", "Петров Иван Сергеевич", "ФИО"],
    [tok("FIO_2", "p"), "Сидорова Анна Викторовна <span class='forms'>· Сидоровой А. В.</span>", "Сидорова Анна Викторовна", "ФИО"],
    ["ООО «" + tok("YUL_1", "o") + "»", "«Северный ветер»", "«Северный ветер»", "Организация"],
    [tok("INN_1", "n"), "7712345678", "7712345678", "ИНН"],
    [tok("ADR_1", "a"), "г. Москва, ул. Лесная, д. 5, кв. 12", "г. Москва, ул. Лесная, д. 5, кв. 12", "Адрес"],
    [tok("RS_1", "n"), "40702810900000000017", "40702810900000000017", "Расчётный счёт"],
  ].slice(0, n);
  return `<div class="sec"><div class="sec-h"><h2>${ic("chevron-down")}Таблица замен · ${total}</h2><span class="grow"></span>
    <span class="field" style="width:250px">${ic("search")}Найти: фамилия, ИНН</span>
    <span class="sel">Вид: все${ic("chevron-down")}</span><span class="btn">${ic("plus")}Добавить вручную</span></div>
    <div class="card" style="overflow:hidden"><table class="tbl"><tr><th style="width:150px">Метка</th><th>В документе</th><th class="hide-narrow">Для нового текста</th><th style="width:150px">Вид</th><th style="width:40px"></th></tr>
    ${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="hide-narrow">${r[2]}</td><td class="muted">${r[3]}</td><td><span class="ib">${ic("ellipsis")}</span></td></tr>`).join("")}</table></div></div>`;
}

const S = {};
S.empty = () => {
  menu("anon"); crumbs(["Обезличить"]); model("", "Модель готова");
  return head("Обезличить", ANON_SUB, `<span class="btn primary" disabled>${ic("eye-off")}Обезличить</span><span class="xs muted">Добавьте файлы</span>`)
    + `<div class="sessline muted">${ic("info")}Сессия появится сама при первом файле.</div>`
    + `<div class="drop big">${ic("upload")}<div><b>Перетащите файлы</b> или выберите на компьютере</div><div class="small">Word, PDF, сканы, Excel, PowerPoint, RTF, TXT, фото · до 100 МБ каждый</div></div>`;
};
S.upload = () => {
  menu("anon"); crumbs(["Обезличить", SESS + " · 3 файла"]); model("", "Модель готова");
  return head("Обезличить", ANON_SUB, `<span class="btn primary">${ic("eye-off")}Обезличить (3)</span>`)
    + sessline("3 файла", "0 записей") + strip
    + `<div class="card list">`
    + frow("doc", "Договор поставки - Петров.docx", "Новый · 1,2 МБ", "", ACT_NEW)
    + frow("xls", "Реестр платежей сентябрь.xlsx", "Новый · 86 КБ", "", ACT_NEW)
    + frow("img", "Скан паспорта.pdf", "Новый · 3,4 МБ · скан - будет распознан", "", ACT_NEW)
    + `</div>`
    + `<div class="sec"><div class="sec-h"><h2>${ic("chevron-down")}Таблица замен · 0</h2><span class="grow"></span><span class="btn">${ic("plus")}Добавить вручную</span></div>
       <div class="card" style="padding:18px 16px" ><span class="muted">Записей пока нет - они появятся после обработки. Можно добавить вручную: запись применится при обработке.</span></div></div>`;
};
S.processing = () => {
  menu("anon"); crumbs(["Обезличить", SESS + " · 3 файла"]); model("work", "Работает: файл 2 из 3");
  return head("Обезличить", ANON_SUB, `<span class="btn primary" disabled>${ic("eye-off")}Обезличить</span><span class="xs muted">Идёт обработка</span>`)
    + sessline("3 файла", "14 записей")
    + `<div class="card prog"><div class="bar"><i style="width:46%"></i></div><div class="prow"><b>46 %</b><span>Файл 2 из 3 · Ищу данные</span><span class="muted">0:14 · осталось ~0:20</span><span class="grow"></span><span class="btn sm">${ic("circle-stop")}Остановить</span></div></div>`
    + `<div class="card list">`
    + frow("doc", "Договор поставки - Петров.docx", `${ic("check")}Найдено 14 · утечек нет · Договор поставки ${tok("FIO_1", "p")}.docx`, "ok", ACT_DONE)
    + frow("xls", "Реестр платежей сентябрь.xlsx", `${ic("clock")}Ищу данные…`, "", "")
    + frow("img", "Скан паспорта.pdf", "В очереди", "", "")
    + `</div>` + table(2, 14);
};
S.done = () => {
  menu("anon"); crumbs(["Обезличить", SESS + " · 3 файла"]); model("", "Модель готова");
  return head("Обезличить", ANON_SUB, `<span class="btn primary" disabled>${ic("eye-off")}Обезличить</span><span class="xs muted">Новых файлов нет</span>`)
    + sessline("3 файла", "41 запись") + strip
    + `<div class="card sum"><span class="big">${ic("shield-check")}Готово: 3 файла · 41 запись</span><span class="chip warn">${ic("triangle-alert")}Проверьте 1 файл</span><span class="grow"></span>
       <span class="btn">${ic("download")}Скачать все (ZIP)</span><span class="btn">${ic("copy")}Инструкция для нейросети: Скопировать</span></div>`
    + `<div class="card list">`
    + frow("doc", "Договор поставки - Петров.docx", `${ic("check")}Найдено 14 · утечек нет · Договор поставки ${tok("FIO_1", "p")}.docx`, "ok", ACT_DONE)
    + frow("xls", "Реестр платежей сентябрь.xlsx", `${ic("triangle-alert")}Найдено 9 · проверьте 2 места - откройте «Просмотр»: там их можно замаскировать`, "warn", ACT_DONE)
    + frow("img", "Скан паспорта.pdf", `${ic("check")}Найдено 6 · утечек нет · закрашено по распознанному тексту - вернуть данные в этот файл нельзя`, "ok", ACT_DONE)
    + `</div>` + table(5);
};
function previewBody(withSel) {
  return `<div class="pvbar"><span class="fn">Договор поставки ${tok("FIO_1", "p")}.docx</span><span class="grow"></span>
      <span class="field hide-narrow" style="width:260px">${ic("search")}Найти в тексте</span>
      <span class="check"><span class="box"></span>Показать исходный текст</span><span class="btn sm">${ic("download")}Скачать${ic("chevron-down")}</span></div>
    <div class="pv"><div class="doc"><div class="sheet">
      <h3>ДОГОВОР ПОСТАВКИ № 17</h3><p class="c">г. Москва · 3 сентября 2026 г.</p>
      <p>Общество с ограниченной ответственностью «${tok("YUL_1", "o")}», ИНН ${tok("INN_1", "n")}, именуемое в дальнейшем «Поставщик», в лице генерального директора <span class="tok k-p cur">[FIO_1]</span>, действующего на основании Устава, с одной стороны, и ${tok("FIO_2", "p")}, паспорт ${tok("PASS_1", "n")}, зарегистрированная по адресу: ${tok("ADR_1", "a")}, именуемая «Покупатель», с другой стороны, заключили настоящий договор.</p>
      <p>1. Поставщик передаёт Покупателю товар по спецификации, а Покупатель оплачивает его на расчётный счёт ${tok("RS_1", "n")} в банке ${tok("YUL_2", "o")}, БИК ${tok("BIK_1", "n")}.</p>
      <p style="position:relative">2. Приёмку товара со стороны Поставщика ведёт менеджер <span class="${withSel ? "selx" : ""}" id="sel">Ковалёв Д.</span>, телефон ${tok("TEL_1", "n")}, электронная почта ${tok("EMAIL_1", "n")}.</p>
      
      <p>3. Подписи сторон: Поставщик - <span class="tok k-p cur">[FIO_1]</span>; Покупатель - ${tok("FIO_2", "p")}.</p>
    </div></div>
    <div class="side2"><div class="ph">
      <div class="alert warn">${ic("triangle-alert")}<span><b>Проверьте: 1 место</b> · «Ковалёв Д.» - похоже на фамилию, щелчок - к месту</span></div>
      <div style="display:flex; gap:8px"><span class="field" style="flex:1">${ic("search")}Найти значение</span><span class="sel">Вид${ic("chevron-down")}</span></div>
    </div><div class="ps">
      <div class="grp">Люди</div>
      <div class="val on"><div class="l"><span class="v"><b>Петров Иван Сергеевич</b></span><span class="n">×6</span>${tok("FIO_1", "p")}</div><div class="f">Петрову И. С. · Петров</div>
        <div class="b"><span class="btn sm">${ic("pencil")}Изменить</span><span class="btn sm">${ic("plus")}Другое написание…</span><span class="btn sm">${ic("eye")}Не маскировать</span></div></div>
      <div class="val"><div class="l"><span class="v">Сидорова Анна Викторовна</span><span class="n">×2</span>${tok("FIO_2", "p")}</div></div>
      <div class="grp">Организации</div>
      <div class="val"><div class="l"><span class="v">«Северный ветер»</span><span class="n">×4</span>${tok("YUL_1", "o")}</div></div>
      <div class="val"><div class="l"><span class="v">АО «Банк Пример»</span><span class="n">×1</span>${tok("YUL_2", "o")}</div></div>
      <div class="grp">Адреса</div>
      <div class="val"><div class="l"><span class="v">г. Москва, ул. Лесная, д. 5, кв. 12</span><span class="n">×1</span>${tok("ADR_1", "a")}</div></div>
      <div class="grp">Реквизиты и номера</div>
      <div class="val"><div class="l"><span class="v">7712345678</span><span class="n">×1</span>${tok("INN_1", "n")}</div></div>
    </div></div></div>`;
}
S.preview = () => {
  menu("anon"); crumbs(["Обезличить", SESS, "Договор поставки [FIO_1].docx"], true); model("", "Модель готова");
  return previewBody(true);
};
S.unmask = () => {
  menu("anon"); crumbs(["Обезличить", SESS, "Договор поставки [FIO_1].docx"], true); model("", "Модель готова");
  layer(`<div class="ov"><div class="dlg"><h2>Не маскировать «Петров Иван Сергеевич»?</h2>
    <p>В файлах значение останется открытым. Метка ${tok("FIO_1", "p")} пропадёт из текста, запись перейдёт в «Не маскируется» - её можно вернуть.</p>
    <div class="radio"><span class="rd on"></span>Только в этой сессии</div>
    <div class="radio"><span class="rd"></span>Всегда - в Словарь «Никогда не маскировать»</div>
    <div class="btns"><span class="btn">Отмена</span><span class="btn primary">Не маскировать</span></div>
    <div class="hint">Enter - не маскировать · Esc - отмена</div></div></div>`);
  return previewBody(false);
};
S.restore = () => {
  menu("restore"); crumbs(["Вернуть данные", SESS + " · 3 файла"]); model("", "Модель готова");
  return head("Вернуть данные", "Загрузите ответ нейросети - метки заменятся значениями из выбранной сессии.", `<span class="btn primary" disabled>${ic("undo-2")}Вернуть данные</span><span class="xs muted">Новых файлов нет</span>`)
    + `<div class="sessline"><span class="muted">Сессия:</span><span class="sel"><b>${SESS}</b> · 3 файла · 41 запись${ic("chevron-down")}</span></div>` + strip.replace("ещё файлы", "ответ нейросети")
    + `<div class="card sum"><span class="big">${ic("shield-check")}Готово: 2 файла · вернулось 52 значения</span><span class="chip bad">${ic("triangle-alert")}1 метка не найдена</span><span class="grow"></span><span class="btn">${ic("download")}Скачать все (ZIP)</span></div>`
    + `<div class="card list">`
    + frow("doc", "Ответ нейросети - претензия.docx", `<span class="chip ok">31 точно</span><span class="chip warn">6 с подбором падежа</span><span>→ Претензия покупателю_restored.docx</span>`, "", ACT_DONE)
    + frow("doc", "Ответ нейросети - письмо.docx", `<span class="chip ok">15 точно</span><span class="chip bad">не найдены в этой сессии: [FIO_9] - проверьте, та ли сессия выбрана</span>`, "", ACT_DONE)
    + `</div>`
    + `<div class="sec"><div class="card" style="padding:12px 16px; display:flex; gap:14px; align-items:center; flex-wrap:wrap"><span class="muted small">В «Просмотре» вставленные значения подсвечены:</span><span class="chip ok">точно</span><span class="chip warn">падеж подобран - проверьте</span><span class="chip bad">метка не найдена</span></div></div>`;
};
S.dict = () => {
  menu("dict"); crumbs(["Словарь"]); model("", "Модель готова");
  const rows = [["Петров Иван Сергеевич", "ФИО", "добавлено 24.10 вручную"], ["«Северный ветер»", "Организация", "добавлено 22.10 вручную"], ["Ковалёв Дмитрий", "ФИО", "20.10, до версии 4.0"], ["+7 900 000-00-17", "Телефон", "18.10, до версии 4.0"], ["ул. Лесная, д. 5", "Адрес", "15.10, до версии 4.0"]];
  return head("Словарь", "Действует во всех сессиях. Хранится отдельно от сессий: удаление сессии его не трогает.", `<span class="btn primary">${ic("plus")}Добавить</span>`)
    + `<div class="sessline"><div class="seg"><span class="on">Всегда маскировать · 12</span><span>Никогда не маскировать · 5</span></div><span class="grow"></span><span class="field" style="width:280px">${ic("search")}Найти значение</span></div>`
    + `<div class="card list">${rows.map(r => `<div class="row"><div class="main2"><div class="nm">${r[0]}</div><div class="meta">${r[1]} · ${r[2]}</div></div><div class="acts"><span class="ib" title="Убрать из Словаря">${ic("x")}</span></div></div>`).join("")}</div>`
    + `<div style="margin-top:12px; display:flex; gap:10px"><span class="link small">Очистить список…</span></div>`
    + `<div class="toast">Петров Иван Сергеевич убран из Словаря <b>Вернуть</b></div>`;
};
function sessionsBody() {
  const rows = [["Сессия 24.10", "3 файла · 41 запись · 24.10.2026, 14:05", ""], ["Аренда офиса", "2 файла · 27 записей · 23.10.2026, 11:40", ""], ["Сессия 21.10", "1 файл · 12 записей · 21.10.2026, 09:15", ""], ["Претензия поставщику", "4 файла · 58 записей · 12.10.2026, 16:22", ""], ["Сессия 27.09", "2 файла · 19 записей · 27.09.2026, 10:03", "удалится через 3 дня"]];
  return head("Сессии", "Сессия хранит файлы и таблицу замен. Удаляется целиком через 30 дней (Настройки → Хранение).", `<span class="btn primary">${ic("plus")}Новая сессия</span>`)
    + `<div class="sessline"><span class="field" style="width:320px">${ic("search")}Найти сессию</span></div>`
    + `<div class="card list">${rows.map((r, i) => `<div class="row"><span class="box"></span><span class="ic">${ic("folder")}</span><div class="main2"><div class="nm">${r[0]}</div><div class="meta">${r[1]}${r[2] ? ` <span class="chip warn">${ic("clock")}${r[2]}</span>` : ""}</div></div><div class="acts"><span class="ib">${ic("ellipsis")}</span><span class="ib" title="Удалить">${ic("x")}</span></div></div>`).join("")}</div>`;
}
S.sessions = () => { menu("sessions"); crumbs(["Сессии"]); model("", "Модель готова"); return sessionsBody(); };
S.delete = () => {
  menu("sessions"); crumbs(["Сессии"]); model("", "Модель готова");
  layer(`<div class="ov"><div class="dlg"><h2>Удалить «Сессия 24.10»?</h2>
    <p>Удалятся оригиналы, обезличенные файлы и таблица замен: <b>3 файла, 41 запись</b>. Вернуть данные в ответ нейросети после этого будет нельзя.</p>
    <p><b>Отменить удаление нельзя.</b> Словарь остаётся - он общий для всех сессий.</p>
    <div class="btns"><span class="btn focusring">Отмена</span><span class="btn danger">${ic("trash-2")}Удалить навсегда</span></div>
    <div class="hint">Esc - отмена · Enter не удаляет</div></div></div>`);
  return sessionsBody();
};
S.settings = () => {
  menu("settings"); crumbs(["Настройки"]); model("", "Модель готова");
  const r = (lab, d, ctl) => `<div class="srow"><div class="lab"><div>${lab}</div><div class="d">${d}</div></div>${ctl}</div>`;
  const sel = t => `<span class="sel">${t}${ic("chevron-down")}</span>`;
  return head("Настройки", "Изменения сохраняются сразу.", "")
    + `<div class="card sgrp"><div class="gh"><h2>Обезличивание</h2></div>`
    + r("PDF с текстом - в Word", "PDF с текстовым слоем обезличивается как Word - формат сохраняется лучше", `<span class="sw on"></span>`)
    + r("Также сохранить PDF", "Рядом с Word - обезличенный PDF", `<span class="sw"></span>`) + `</div>`
    + `<div class="card sgrp"><div class="gh"><h2>Возврат данных</h2></div>`
    + r("Название организации без кавычек", "Как вставить название, если нейросеть убрала кавычки", sel("Ставить «»"))
    + r("ОПФ (ООО, АО…)", "Добавлять ли ООО, АО…, если рядом их нет", sel("По смыслу"))
    + r("Подсветить в Word места с подобранным падежом", "Жёлтая заливка - проверьте эти места", `<span class="sw on"></span><span class="chip ok xs">Сохранено</span>`) + `</div>`
    + `<div class="card sgrp"><div class="gh"><h2>Хранение</h2></div>`
    + r("Хранить сессии", "Сессия удаляется целиком: оригиналы, файлы, таблица замен. За 3 дня - пометка в «Сессиях»", `<div class="seg"><span>7 дней</span><span class="on">30 дней</span><span>90 дней</span></div>`) + `</div>`
    + `<div class="card sgrp"><div class="gh">${ic("chevron-down")}<h2>Дополнительно</h2></div>`
    + r("Использовать нейросеть", "Локальная нейросеть проверяет найденное и подбирает падеж в спорных местах. Медленнее; по замерам пользы почти нет. Работает в очереди видеокарты", `<span class="sw"></span>`) + `</div>`
    + `<div class="card sgrp"><div class="gh collapsed">${ic("chevron-down").replace('class="i"', 'class="i" style="transform:rotate(-90deg)"')}<h2>Служебное</h2><span class="muted small">папка данных, журнал, режим диагностики, версия, остановить программу</span></div></div>`;
};

function layer(html) { document.getElementById("layer").innerHTML = html; }
const st = (location.hash || "#empty").slice(1);
document.getElementById("content").innerHTML = (S[st] || S.empty)();
// кнопка «Замаскировать» - сразу под выделением
const sel = document.querySelector(".selx");
if (sel) {
  const sh = document.querySelector(".sheet"), a = sel.getBoundingClientRect(), b = sh.getBoundingClientRect();
  sh.insertAdjacentHTML("beforeend", `<span class="floatbtn" style="left:${a.left - b.left}px; top:${a.bottom - b.top + 4}px">${ic("eye-off")}Замаскировать</span>`);
}
</script>
</body>
</html>
