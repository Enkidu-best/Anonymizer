<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a8f"/>
      <stop offset="1" stop-color="#0c1233"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6eaf5"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b7cff"/>
      <stop offset="1" stop-color="#3f5ef0"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ee59d"/>
      <stop offset="1" stop-color="#12b877"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS squircle tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- document sheet with folded corner -->
  <g filter="url(#shadow)">
    <path d="M300 220 H620 L724 324 V804 Q724 820 708 820 H316 Q300 820 300 804 Z" fill="url(#paper)"/>
    <path d="M620 220 V308 Q620 324 636 324 H724 Z" fill="#c9d0e6"/>
  </g>

  <!-- text lines -->
  <g fill="#c3cae0">
    <rect x="356" y="300" width="210" height="26" rx="13"/>
    <rect x="356" y="364" width="312" height="26" rx="13"/>
    <rect x="356" y="508" width="312" height="26" rx="13"/>
    <rect x="356" y="652" width="190" height="26" rx="13"/>
  </g>

  <!-- redacted placeholders [ ] -->
  <g>
    <rect x="356" y="420" width="312" height="52" rx="14" fill="url(#pill)"/>
    <path d="M384 430 h-12 v32 h12 M640 430 h12 v32 h-12" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="356" y="564" width="230" height="52" rx="14" fill="url(#pill)"/>
    <path d="M384 574 h-12 v32 h12 M558 574 h12 v32 h-12" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- reversible badge: two arrows in a circle -->
  <g transform="translate(700 700)">
    <circle r="112" fill="url(#badge)" stroke="#0c1233" stroke-width="14"/>
    <g fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-52 -14 A56 56 0 0 1 44 -34"/>
      <path d="M20 -48 L46 -34 L34 -6"/>
      <path d="M52 14 A56 56 0 0 1 -44 34"/>
      <path d="M-20 48 L-46 34 L-34 6"/>
    </g>
  </g>
</svg>
